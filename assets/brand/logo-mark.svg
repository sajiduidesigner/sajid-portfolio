<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Sajid Khan SK monogram</title>
  <desc id="desc">A premium geometric SK monogram in a violet to cyan gradient on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="145" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A24"/>
      <stop offset="1" stop-color="#090B11"/>
    </linearGradient>
    <linearGradient id="accent" x1="42" y1="35" x2="122" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6D7CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="34" fill="url(#bg)" stroke="#282D3E" stroke-width="2"/>
  <path d="M34 52C34 39 44 30 58 30H92" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <path d="M92 30H60C44 30 34 39 34 52C34 65 44 72 59 75L79 79C94 82 102 90 102 103C102 119 89 130 71 130H35" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 34V126" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M106 82L131 56M106 82L134 114" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="132" cy="56" r="4" fill="#22D3EE"/>
</svg>
